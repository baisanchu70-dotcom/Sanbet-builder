').classList.add('show')">LOGIN</button></div><div class="hero"><h1>BET BIG, <em>WIN BIGGER</em></h1><button class="cta" onclick="document.getElementById('L').classList.add('show')">START WINNING NOW</button><div id="cnt" style="margin-top:10px;color:#6a7a9a;font-size:12px">0 in Betslip - Tap odds!</div></div><div class="match"><div><b>Man City vs Arsenal</b><br><small>21:00 Premier League</small></div><div class="odds"><button onclick="add(this,'ManCity-Ars','City','1.85')">1.85</button><button onclick="add(this,'ManCity-Ars','Draw','3.40')">3.40</button><button onclick="add(this,'ManCity-Ars','Arsenal','2.10')">2.10</button></div></div><div class="match"><div><b>Vipers vs KCCA</b><br><small>16:00 UPL</small></div><div class="odds"><button onclick="add(this,'Vipers-KCCA','Vipers','2.05')">2.05</button><button onclick="add(this,'Vipers-KCCA','Draw','3.10')">3.10</button><button onclick="add(this,'Vipers-KCCA','KCCA','2.30')">2.30</button></div></div><div class="slip" id="S"><div style="display:flex;justify-content:space-between"><b id="T">Betslip</b><span onclick="clr()" style="color:#f44">Clear</span></div><div id="I" style="margin:8px 0;font-size:12px"></div><input id="K" type="number" placeholder="Stake UGX min 1000" style="width:100%;padding:10px;border-radius:8px;background:#0a0e1a;color:#fff;border:1px solid #344a82"><div>Win: <b id="W" style="color:#ffcc00">UGX 0</b></div><button class="btn" onclick="bet()">PLACE BET NOW</button></div><div class="box" id="L"><div class="card"><h3 style="color:#ffcc00">SANBET LOGIN</h3><input placeholder="Phone 0700..."><input type="password" placeholder="Password"><button class="btn" onclick="alert('✅ Welcome! Bonus UGX 10,000!');document.getElementById('L').classList.remove('show')">LOGIN</button><button class="btn" style="background:#1e2e5a;color:#fff" onclick="document.getElementById('L').classList.remove('show')">CLOSE</button></div></div><script>let bets=[];function add(el,m,s,o){let pr=el.parentElement;pr.querySelectorAll('button').forEach(b=>b.classList.remove('on'));let i=bets.findIndex(b=>b.m===m);if(i>-1&&bets[i].o===o){bets.splice(i,1)}else{el.classList.add('on');if(i>-1)bets[i]={m:m,s:s,o:o};else bets.push({m:m,s:s,o:o}) }upd()}function upd(){let sl=document.getElementById('S');let ct=document.getElementById('cnt');if(bets.length==0){sl.classList.remove('show');ct.innerText='0 in Betslip - Tap odds!';return}sl.classList.add('show');ct.innerText=bets.length+' in Betslip - Scroll down!';document.getElementById('T').innerText='Betslip ('+bets.length+')';let h='';let tot=1;bets.forEach(b=>{h+=b.m+' '+b.s+' @'+b.o+'<br>';tot*=parseFloat(b.o)});document.getElementById('I').innerHTML=h+'Odd: '+tot.toFixed(2);document.getElementById('I').dataset.tot=tot;calc()}function calc(){let st=parseFloat(document.getElementById('K').value)||0;let tot=parseFloat(document.getElementById('I').dataset.tot)||0;document.getElementById('W').innerText='UGX '+(st*tot).toFixed(0)}document.getElementById('K').addEventListener('input',calc);function clr(){bets=[];document.querySelectorAll('.odds button').forEach(b=>b.classList.remove('on'));upd()}function bet(){let st=document.getElementById('K').value;if(!st||st<1000){alert('Min 1000');return}alert('✅ BET PLACED! Win: '+document.getElementById('W').innerText);clr()}</script></body></html>
